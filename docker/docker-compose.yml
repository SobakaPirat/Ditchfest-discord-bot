services:
  df-notifier:
    container_name: df-notifier
    image: ditch-bot:dev
    environment:
      - TZ=Europe/Moscow
    volumes:
      - ../logs:/app/logs           # Папка для логов (опционально)
      - ../database:/app/database   # Папка для базы данных (создаст новую бд если в папке пусто)
      - ../config:/app/config       # Файл .env (ОБЯЗАТЕЛЬНО скопируйте .env_template в .env и заполните своими данными)
    restart: unless-stopped
    command: ["uv", "run", "notifier.py"]
    depends_on:
      df-updater:
        condition: service_healthy 

  df-updater:
    container_name: df-updater
    image: ditch-bot:dev
    environment:
      - TZ=Europe/Moscow            # Тайм зона для логов
    volumes:
      - ../logs:/app/logs           # Папка для логов (опционально)
      - ../database:/app/database   # Папка для базы данных (создаст новую бд если в папке пусто)
      - ../config:/app/config       # Файл .env (ОБЯЗАТЕЛЬНО скопируйте .env_template в .env и заполните своими данными)
    restart: unless-stopped
    command: ["uv", "run", "updater.py"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/database/.ready"]
      interval: 30s        # как часто запускать проверку
      timeout: 60s         # сколько ждать выполнения одной проверки
      retries: 100         # сколько неудач подряд до статуса "unhealthy"
      start_period: 1200s   # "льготный" период после старта контейнера